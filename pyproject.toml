[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksr-index"
version = "0.1.0"
description = "Knowledge, Science, Reasoning leaderboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "pyarrow>=17,<22",
  "scipy>=1.14,<2",
]

[project.scripts]
ksr = "ksr_index.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ksr_index = ["templates/*.j2", "static/*.css", "static/*.js"]

